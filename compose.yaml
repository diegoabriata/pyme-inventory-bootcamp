services:
  postgres:
    image: postgres:16-alpine
    container_name: pyme-postgres
    environment:
      POSTGRES_DB: pyme_inventory
      POSTGRES_USER: pyme_user
      POSTGRES_PASSWORD: pyme_password
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pyme_user -d pyme_inventory"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
